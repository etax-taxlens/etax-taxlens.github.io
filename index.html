<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAX Lens</title>
<meta name="theme-color" content="#14306A"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png?v=2"><link rel="icon" href="icon-192.png?v=2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TAX Lens"><meta name="mobile-web-app-capable" content="yes">
<style>html,body{margin:0;height:100%;background:#fff;font-family:"Cairo","Segoe UI",Tahoma,sans-serif;color:#14306A}
.w{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px;box-sizing:border-box}
h1{margin:0;font-size:34px;letter-spacing:.5px}p{margin:0;color:#4A5875;font-size:15px}
.bar{width:180px;height:4px;border-radius:4px;background:#E6EBF2;overflow:hidden}.bar i{display:block;width:40%;height:100%;background:#D6202E;animation:m 1.1s infinite ease-in-out}
@keyframes m{0%{transform:translateX(-120%)}100%{transform:translateX(300%)}}
button{font:700 14px inherit;font-family:inherit;border:0;background:#14306A;color:#fff;border-radius:999px;padding:9px 24px;cursor:pointer}</style></head>
<body><div class="w"><img src="icon-192.png" alt="" style="width:96px;height:96px;border-radius:22px;box-shadow:0 10px 30px rgba(20,48,106,.18)"><h1>TAX <span style="color:#D6202E">Lens</span></h1><p style="margin-top:-8px">منصة تحليل البيانات الضريبية</p><p id="m" style="font-size:13px">جارٍ تحميل أحدث نسخة…</p><div class="bar" id="b"><i></i></div></div>
<script>
/* TAX Lens portal: always loads the latest dashboard from GitHub, so this file never needs to be sent again. */
(function(){
  var UI='v1';try{UI=localStorage.getItem('tl_ui')||'v1'}catch(e){}var FILE=UI==='v2'?'app-v2.html':'app.html';window.TL_PORTAL=2;
  var API='https://api.github.com/repos/fouadelwakil-debug/taxlens-data/contents/'+FILE+'?ref=main',RAW='https://raw.githubusercontent.com/fouadelwakil-debug/taxlens-data/main/'+FILE;
  function get(u,h){return fetch(u+(u.indexOf('?')<0?'?':'&')+'t='+Date.now(),{cache:'no-store',headers:h||{}}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text()})}
  function fail(){document.getElementById('b').hidden=true;var m=document.getElementById('m');m.textContent='تعذر تحميل TAX Lens. تأكد من الاتصال بالإنترنت وحاول تاني.';
    var x=document.createElement('button');x.textContent='إعادة المحاولة';x.onclick=function(){location.reload()};m.parentNode.appendChild(x)}
  function cache(){try{return caches.open('tl-v1')}catch(e){return Promise.reject(e)}}
  function run(h){document.open();document.write(h);document.close()}
  function fromCache(){return cache().then(function(c){return c.match('app-'+UI)}).then(function(r){if(!r)throw new Error('none');return r.text()})}
  var to=new Promise(function(_,no){setTimeout(function(){no(new Error('slow'))},45000)});
  Promise.race([get(API,{Accept:'application/vnd.github.raw+json'}).catch(function(){return get(RAW)}),to])
    .then(function(h){if(h.indexOf('TAX Lens')<0)throw new Error('bad');cache().then(function(c){return c.put('app-'+UI,new Response(h,{headers:{'Content-Type':'text/html'}}))}).catch(function(){});run(h)})
    .catch(function(){fromCache().then(function(h){get(RAW).then(function(n){if(n.indexOf('TAX Lens')>=0&&n!==h)cache().then(function(c){return c.put('app-'+UI,new Response(n,{headers:{'Content-Type':'text/html'}}))})}).catch(function(){});run(h);setTimeout(function(){try{var d=document.createElement('div');d.textContent='بتشوف نسخة محفوظة لأن التحميل كان بطيء. اعمل تحديث للصفحة عشان تاخد أحدث نسخة.';d.style.cssText='position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:99999;background:#D6202E;color:#fff;padding:10px 18px;border-radius:999px;font:700 13px Cairo,Tahoma,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer';d.onclick=function(){location.reload()};document.body.appendChild(d)}catch(e){}},1500)}).catch(fail)});
})();
if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
</script></body></html>
