<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAX Lens</title>
<meta name="theme-color" content="#14306A"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png?v=2"><link rel="icon" href="icon-192.png?v=2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TAX Lens"><meta name="mobile-web-app-capable" content="yes">
<style>html,body{margin:0;height:100%;background:#fff;font-family:"Cairo","Segoe UI",Tahoma,sans-serif;color:#14306A}
.w{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px;box-sizing:border-box;transition:opacity .45s ease,transform .55s cubic-bezier(.4,0,.2,1)}
h1{margin:0;font-size:34px;letter-spacing:.5px}p{margin:0;color:#4A5875;font-size:15px}
.lg{position:relative;width:96px;height:96px;border-radius:22px;box-shadow:0 10px 30px rgba(20,48,106,.18);transition:transform .55s cubic-bezier(.4,0,.2,1)}
.lg svg,.lg img{position:absolute;inset:0;width:100%;height:100%;border-radius:22px}
.lg img{opacity:0;transition:opacity .35s}.lg.done img{opacity:1}
.lg .sq{transform-origin:50% 50%;transform:scale(.6);opacity:0;animation:sq .5s cubic-bezier(.3,1.4,.5,1) forwards}
.lg .st{fill:none;stroke-linecap:butt;stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:dr var(--d) cubic-bezier(.6,0,.3,1) forwards;animation-delay:var(--s)}
.lg.pulse{animation:pu .6s ease}
@keyframes sq{to{transform:scale(1);opacity:1}}@keyframes dr{to{stroke-dashoffset:0}}@keyframes pu{40%{transform:scale(1.07)}100%{transform:scale(1)}}
h1 b,h1 span{display:inline-block;opacity:0}h1 b{font-weight:inherit;transform:translateY(-18px);animation:in .5s cubic-bezier(.3,1.3,.5,1) 1s forwards}h1 span{color:#D6202E;transform:translateX(-10px);animation:in .5s ease 1.25s forwards}
.sub i{font-style:normal;display:inline-block;opacity:0;transform:translateY(6px);animation:in .4s ease forwards}
@keyframes in{to{opacity:1;transform:none}}
.bar{position:relative;width:220px;height:5px;border-radius:5px;background:#E6EBF2;overflow:hidden}.bar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#D6202E,#E8505B);border-radius:5px;transition:width .3s ease,background .3s}
.bar i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transform:translateX(-100%);animation:sh 1.3s infinite}
.bar.ok i{background:#16A36A}
@keyframes sh{to{transform:translateX(200%)}}
.pc{font:600 12px Inter,"Segoe UI",sans-serif;color:#8A94A8;direction:ltr;margin-top:-6px;min-height:16px}
.w.go{opacity:0;transform:translateY(-6vh)}.w.go .lg{transform:translateY(-12vh) scale(.72)}
footer{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,#16336F,#0F2556);color:#C9D6EE;padding:clamp(8px,1.4vh,14px) 12px clamp(9px,1.6vh,16px);transition:opacity .4s;box-shadow:0 -6px 24px rgba(20,48,106,.12)}
.og{display:flex;align-items:stretch;justify-content:center;flex-wrap:wrap}
.pg{display:flex;flex-direction:column;align-items:center;gap:clamp(4px,.8vh,8px);padding:0 clamp(14px,2.2vw,34px);opacity:0;transform:translateY(6px);animation:in .5s ease forwards}.pg+.pg{border-inline-start:1px solid rgba(255,255,255,.18)}
.pc{font-size:clamp(10.5px,1.25vh,12.5px);font-weight:600;color:#AFC0E2;white-space:nowrap}
.pl{display:flex;align-items:center;justify-content:center;gap:clamp(12px,1.6vw,24px);flex:1}.pl img{display:block;width:auto}.et{display:flex;align-items:center}
.sl{height:clamp(40px,7vh,76px)}.ef{height:clamp(28px,4.4vh,46px)}.et img{height:clamp(18px,2.7vh,28px);background:#fff;border-radius:8px;padding:clamp(4px,.6vh,6px) 9px}
@media(max-width:640px){footer{padding:7px 6px 9px}.pg{padding:0 8px}.pc{font-size:9.5px}.pl{gap:7px}.sl{height:clamp(30px,4.6vh,40px)}.ef{height:clamp(19px,2.9vh,25px)}.et img{height:clamp(12px,1.8vh,15px);padding:3px 5px;border-radius:5px}}
body.out footer{opacity:0}
.w{padding-bottom:clamp(90px,16vh,150px)}
button{font:700 14px inherit;font-family:inherit;border:0;background:#14306A;color:#fff;border-radius:999px;padding:9px 24px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.lg *,h1 *,.sub i,.pg,.bar i:after{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}.lg img{opacity:1}.w,.lg{transition:none}}
</style></head>
<body><div class="w" id="w"><div class="lg" id="lg"><svg viewBox="0 0 512 512" aria-hidden="true"><rect class="sq" x="0" y="0" width="512" height="512" rx="118" fill="#14306A"/>
<path class="st" d="M182 140V322Q182 357 222 357H272" stroke="#fff" stroke-width="64" style="--l:330;--d:.55s;--s:.35s"/><path class="st" d="M104 220H276" stroke="#fff" stroke-width="56" style="--l:172;--d:.3s;--s:.75s"/><path class="st" d="M328 118V322Q328 357 368 357H410" stroke="#D6202E" stroke-width="64" style="--l:330;--d:.55s;--s:.55s"/></svg><img src="icon-192.png" alt=""></div>
<h1 dir="ltr"><b>TAX</b> <span>Lens</span></h1><p class="sub" style="margin-top:-8px"><i>منصة</i> <i>تحليل</i> <i>البيانات</i> <i>الضريبية</i></p><p id="m" style="font-size:13px">جارٍ تحميل أحدث نسخة…</p><div class="bar" id="b"><i id="bi"></i></div><div class="pc" id="pc"></div></div><footer><div class="og"><div class="pg"><div class="pc">تطوير وتشغيل</div><div class="pl"><span class="et"><img src="etax-logo.png" alt="eTax"></span><img class="ef" src="org/efinance.png" alt="e-finance"></div></div><div class="pg"><div class="pc">الجهات صاحبة البيانات</div><div class="pl"><img class="sl" src="org/reta.png" alt="مصلحة الضرائب العقارية"><img class="sl" src="org/eta.png" alt="مصلحة الضرائب المصرية"><img class="sl" src="org/mof.png" alt="وزارة المالية"></div></div></div></footer>
<script>
/* TAX Lens portal: always loads the latest dashboard from GitHub, so this file never needs to be sent again. */
(function(){
  var UI='v1';try{UI=localStorage.getItem('tl_ui')||'v1'}catch(e){}var FILE=UI==='v2'?'app-v2.html':'app.html';window.TL_PORTAL=2;
  var API='https://api.github.com/repos/fouadelwakil-debug/taxlens-data/contents/'+FILE+'?ref=main',RAW='https://raw.githubusercontent.com/fouadelwakil-debug/taxlens-data/main/'+FILE;
  var T0=Date.now(),SZ=4.3e6;try{SZ=+localStorage.getItem('tl_sz')||SZ}catch(e){}var bi=document.getElementById('bi'),pc=document.getElementById('pc'),shown=0;
  [].forEach.call(document.querySelectorAll('.sub i'),function(e,i){e.style.animationDelay=(1.45+i*.12)+'s'});
  setTimeout(function(){var l=document.getElementById('lg');l.classList.add('done','pulse')},1250);
  [].forEach.call(document.querySelectorAll('.pg'),function(e,i){e.style.animationDelay=(1.7+i*.14)+'s'});
  function prog(f){f=Math.max(shown,Math.min(1,f));shown=f;bi.style.width=(f*100).toFixed(1)+'%';pc.textContent=Math.round(f*100)+'%'}
  var fake=setInterval(function(){if(shown<.9)prog(shown+(.9-shown)*.03)},120);
  function get(u,h){return fetch(u+(u.indexOf('?')<0?'?':'&')+'t='+Date.now(),{cache:'no-store',headers:h||{}}).then(function(r){if(!r.ok)throw new Error(r.status);var cl=+r.headers.get('content-length')||0,tot=cl>5e5?cl:SZ;
    if(!r.body||!window.TextDecoder)return r.text();var rd=r.body.getReader(),dec=new TextDecoder(),out='',got=0;
    return(function pump(){return rd.read().then(function(x){if(x.done){out+=dec.decode();try{localStorage.setItem('tl_sz',String(got))}catch(e){}return out}got+=x.value.length;out+=dec.decode(x.value,{stream:true});prog(Math.min(.97,got/tot));return pump()})})()})}
  function fail(){clearInterval(fake);document.getElementById('b').hidden=true;pc.textContent='';var m=document.getElementById('m');m.textContent='تعذر تحميل TAX Lens. تأكد من الاتصال بالإنترنت وحاول تاني.';
    var x=document.createElement('button');x.textContent='إعادة المحاولة';x.onclick=function(){location.reload()};m.parentNode.appendChild(x)}
  function cache(){try{return caches.open('tl-v1')}catch(e){return Promise.reject(e)}}
  function run(h){clearInterval(fake);prog(1);document.getElementById('b').classList.add('ok');var wait=Math.max(0,1500-(Date.now()-T0)),rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(function(){if(rm){go();return}document.getElementById('w').classList.add('go');document.body.classList.add('out');setTimeout(go,480)},rm?0:wait+220);
    function go(){document.open();document.write(h);document.close()}}
  function fromCache(){return cache().then(function(c){return c.match('app-'+UI)}).then(function(r){if(!r)throw new Error('none');return r.text()})}
  var to=new Promise(function(_,no){setTimeout(function(){no(new Error('slow'))},45000)});
  Promise.race([get(API,{Accept:'application/vnd.github.raw+json'}).catch(function(){return get(RAW)}),to])
    .then(function(h){if(h.indexOf('TAX Lens')<0)throw new Error('bad');cache().then(function(c){return c.put('app-'+UI,new Response(h,{headers:{'Content-Type':'text/html'}}))}).catch(function(){});run(h)})
    .catch(function(){fromCache().then(function(h){get(RAW).then(function(n){if(n.indexOf('TAX Lens')>=0&&n!==h)cache().then(function(c){return c.put('app-'+UI,new Response(n,{headers:{'Content-Type':'text/html'}}))})}).catch(function(){});run(h);setTimeout(function(){try{var d=document.createElement('div');d.textContent='بتشوف نسخة محفوظة لأن التحميل كان بطيء. اعمل تحديث للصفحة عشان تاخد أحدث نسخة.';d.style.cssText='position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:99999;background:#D6202E;color:#fff;padding:10px 18px;border-radius:999px;font:700 13px Cairo,Tahoma,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer';d.onclick=function(){location.reload()};document.body.appendChild(d)}catch(e){}},1500)}).catch(fail)});
})();
if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
</script></body></html>
